{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">📊 لوحة التحكم</h1>

<div class="row mb-4">
    <div class="col-md-4">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">المشاريع</h5>
                <h2>{{ total_projects }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">المؤشرات</h5>
                <h2>{{ total_indicators }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title">المخاطر المفتوحة</h5>
                <h2>{{ total_risks }}</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
